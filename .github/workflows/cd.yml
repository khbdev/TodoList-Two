name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  docker:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service-todo, task-service-todo, notes-service-todo, email-service-todo, auth-service-todo]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        run: |
          IMAGE=gopherkhb/todoapp:${{ matrix.service }}-latest
          cd services/${{ matrix.service }}

          docker build -t $IMAGE -t gopherkhb/todoapp:${{ matrix.service }}-${{ github.sha }} .
          docker push $IMAGE
          docker push gopherkhb/todoapp:${{ matrix.service }}-${{ github.sha }}